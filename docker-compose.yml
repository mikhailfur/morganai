version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: morganai
      POSTGRES_USER: morganuser
      POSTGRES_PASSWORD: morganpass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend service is optional in compose for local dev
  # backend:
  #   build: ./backend
  #   ports:
  #     - '4000:4000'
  #   env_file: .env
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
