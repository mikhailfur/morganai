services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: morganai
      POSTGRES_USER: morganai
      POSTGRES_PASSWORD: morganai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morganai"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://morganai:morganai@postgres:5432/morganai
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
