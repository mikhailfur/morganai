version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: morganai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: morganai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prisma Migrations (runs once)
  prisma-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: morganai_prisma_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/morganai?schema=public
    command: npx prisma migrate deploy
    volumes:
      - ./backend/prisma:/app/prisma

  # Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: morganai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/morganai?schema=public
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-""}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-""}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-""}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-""}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-""}
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: morganai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/morganai?schema=public
    volumes:
      - ./frontend/uploads:/app/uploads

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: morganai_network
