version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://morganai:password@db:5432/morganai
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - morgan-network

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://backend:8000"
        VITE_WEBAPP_URL: "http://localhost:3000"
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_WEBAPP_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - morgan-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morganai
      POSTGRES_USER: morganai
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morganai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - morgan-network

volumes:
  postgres_data:

networks:
  morgan-network:
    driver: bridge
