[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "morgan-ai"
version = "1.0.0"
description = "Morgan AI Telegram Bot Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "aiogram>=3.15.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "pyjwt>=2.10.0",
    "APScheduler>=3.10.0",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
]
