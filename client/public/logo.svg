<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88">
  <!-- Devil horns -->
  <path fill="#c63d2f" d="M16,14 L10,2 L23,9 Z"/>
  <path fill="#c63d2f" d="M66,14 L57,9 L70,2 Z"/>

  <!-- Top editorial rule -->
  <rect x="5" y="12" width="70" height="2.5" fill="#c63d2f"/>

  <!-- Bold italic M (fill-rule evenodd cuts center notch) -->
  <path
    fill="#c63d2f"
    fill-rule="evenodd"
    d="M5,74 L11,16 L40,49 L69,16 L75,74 Z
       M15,74 L21,23 L40,43 L59,23 L65,74 Z"
  />

  <!-- Devil tail curling from bottom-right, contained in viewBox -->
  <path
    fill="none"
    stroke="#c63d2f"
    stroke-width="2.8"
    stroke-linecap="round"
    d="M75,74 Q83,78 80,84 Q77,88 70,86"
  />

  <!-- Bottom accent rule -->
  <rect x="5" y="76" width="64" height="1.5" fill="#c63d2f" opacity="0.4"/>
</svg>
